[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "beatlens"
version = "0.1.0"
description = "A reproducible research workbench for evaluating explanations of ECG time-series models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "torch>=2.4",
]

[project.optional-dependencies]
demo = [
    "plotly>=5.24",
    "streamlit>=1.39",
]
qtdb = [
    "wfdb>=4.1",
]
dev = [
    "mypy>=1.13",
    "ruff>=0.7",
]

[project.scripts]
beatlens = "beatlens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/beatlens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
